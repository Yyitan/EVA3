model:
  model_name: eva
  prompt_template: ["a photo of x x", "a photo of x", "a photo of x"]
  ctx_init: ["a photo of ", "a photo of ", "a photo of "]
  clip_model: "ViT-L/14"
  # domain-expert adaption (MoE adapter)
  n_routed: 8
  topk_expert: 2
  expert_dim: 64
  # semantic variant alignment
  tau_init: 1.0
  alpha: 0.5
  beta: 0.5
  lambda_1: 0.5
  lambda_2: 0.1

train:
  dataset: mit-states
  optimizer: Adam
  scheduler: StepLR
  step_size: 5
  gamma: 0.5
  lr: 0.0001
  attr_dropout: 0.3
  weight_decay: 0.0001
  context_length: 8
  train_batch_size: 32
  gradient_accumulation_steps: 1
  epochs: 20
  epoch_start: 0
  val_metric: AUC
  save_final_model: True

test:
  eval_batch_size: 32
  open_world: False
  topk: 1
  text_encoder_batch_size: 1024
  threshold_trials: 50
  text_first: True
